services:
  ml_service:
    image: car-price-api:1
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro

  requests:
    image: car-price-requests:1
    environment:
      API_URL: http://ml_service:8000/api/prediction
    depends_on:
      - ml_service

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data: